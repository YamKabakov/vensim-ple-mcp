[build-system]
requires = ["uv_build>=0.10.4,<0.12"]
build-backend = "uv_build"

[project]
name = "vensim-ple-mcp"
version = "0.1.0"
description = "MCP server for Vensim PLE: generate, inspect, preview, and simulate .mdl models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yam Kabakov" }, { name = "Cybing521" }]
keywords = ["vensim", "vensim-ple", "system-dynamics", "pysd", "mcp", "model-context-protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["mcp>=1.20,<2", "pysd>=3.14,<4"]

[project.urls]
Homepage = "https://github.com/YamKabakov/vensim-ple-mcp"
Repository = "https://github.com/YamKabakov/vensim-ple-mcp"
Issues = "https://github.com/YamKabakov/vensim-ple-mcp/issues"

[project.scripts]
vensim-ple-mcp = "vensim_ple_mcp.cli:main"
vensim-ple-mcp-server = "vensim_ple_mcp.server:main"

[tool.uv.build-backend]
module-name = "vensim_ple_mcp"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py310"
